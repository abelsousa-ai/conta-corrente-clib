<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CLIB" />
<meta name="theme-color" content="#1a2740" />
<title>Conta Corrente CLIB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { background:#EEF1EC; }
  .ff-head { font-family: 'Fraunces', serif; }
  .ff-body { font-family: 'IBM Plex Sans', sans-serif; }
  .ff-num  { font-family: 'IBM Plex Mono', monospace; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script type="text/plain" id="app-source">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

// ---------- Supabase ----------
const SUPABASE_URL = "https://ldfjywogxizjgsqxifhi.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_HFqbo0NILjgzGsPWNFLT5g_6ecKa2Ex";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const TIPOS = {
  saldo: { label: "Saldo", short: "SLD", sign: 1 },
  factura: { label: "Factura", short: "FCT", sign: -1 },
  nota_credito: { label: "Nota de Crédito", short: "NC", sign: 1 },
};
const LIMIAR = 1000;

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function fmtMoney(v) {
  const n = Number(v) || 0;
  return n.toLocaleString("pt-PT", { style: "currency", currency: "EUR" });
}
function fmtDate(d) {
  if (!d) return "";
  const [y, m, day] = d.split("-");
  return `${day}/${m}/${y}`;
}
function todayISO() {
  return new Date().toISOString().slice(0, 10);
}
function toCSV(rows) {
  const header = ["Data", "Tipo", "Número", "Valor (efeito no saldo)"];
  const lines = rows.map((r) => {
    const t = TIPOS[r.tipo];
    const efeito = t.sign * r.valor;
    return [fmtDate(r.data), t.label, r.numero, efeito.toFixed(2).replace(".", ",")].join(";");
  });
  return [header.join(";"), ...lines].join("\n");
}

// ---------- Icons (SVG simples, sem dependências) ----------
function Icon({ children, size = 16, className = "" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
      {children}
    </svg>
  );
}
const IconPlus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></Icon>;
const IconX = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></Icon>;
const IconSearch = (p) => <Icon {...p}><circle cx="11" cy="11" r="7" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></Icon>;
const IconChevronDown = (p) => <Icon {...p}><polyline points="6 9 12 15 18 9" /></Icon>;
const IconChevronUp = (p) => <Icon {...p}><polyline points="18 15 12 9 6 15" /></Icon>;
const IconPencil = (p) => <Icon {...p}><path d="M12 20h9" /><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" /></Icon>;
const IconTrash = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6" /><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /><path d="M10 11v6" /><path d="M14 11v6" /></Icon>;
const IconDownload = (p) => <Icon {...p}><path d="M12 3v12" /><polyline points="7 10 12 15 17 10" /><path d="M5 21h14" /></Icon>;
const IconCheck = (p) => <Icon {...p}><polyline points="20 6 9 17 4 12" /></Icon>;
const IconAlert = (p) => <Icon {...p}><path d="M12 2 1 21h22Z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></Icon>;
const IconWallet = (p) => <Icon {...p}><path d="M21 7H5a2 2 0 0 1-2-2 2 2 0 0 1 2-2h14v4Z" /><path d="M3 5v14a2 2 0 0 0 2 2h16v-8" /><path d="M18 12a2 2 0 1 0 0 4h4v-4Z" /></Icon>;
const IconFile = (p) => <Icon {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z" /><polyline points="14 2 14 8 20 8" /><line x1="8" y1="13" x2="16" y2="13" /><line x1="8" y1="17" x2="16" y2="17" /></Icon>;

// ---------- Modal shell ----------
function Modal({ title, onClose, children }) {
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-[#12181f]/90 backdrop-blur-sm p-0 sm:p-4" onClick={onClose}>
      <div className="w-full sm:max-w-md bg-[#FAF8F3] rounded-t-2xl sm:rounded-2xl shadow-2xl border border-[#20304a]/10 max-h-[92vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
        <div className="sticky top-0 bg-[#FAF8F3] flex items-center justify-between px-5 py-4 border-b border-[#20304a]/10">
          <h2 className="ff-head text-lg text-[#1a2740] tracking-tight">{title}</h2>
          <button onClick={onClose} className="p-1.5 rounded-full hover:bg-[#1a2740]/5 text-[#5a6b85]" aria-label="Fechar"><IconX size={18} /></button>
        </div>
        <div className="px-5 py-5">{children}</div>
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return (
    <label className="block mb-4">
      <span className="block text-[11px] font-semibold tracking-[0.08em] uppercase text-[#5a6b85] mb-1.5">{label}</span>
      {children}
    </label>
  );
}
const inputCls = "w-full rounded-lg border border-[#c9d0dc] bg-white px-3 py-2.5 text-[15px] text-[#1a2740] ff-num focus:outline-none focus:ring-2 focus:ring-[#1F6E4F]/40 focus:border-[#1F6E4F] transition";

function SaldoForm({ onSave, onClose, initial }) {
  const [data, setData] = useState(initial?.data || todayISO());
  const [valor, setValor] = useState(initial?.valor ?? "");
  const [numero, setNumero] = useState(initial?.numero || "");
  const [error, setError] = useState("");
  const submit = () => {
    const v = parseFloat(String(valor).replace(",", "."));
    if (!data) return setError("Indica a data.");
    if (!v || v <= 0) return setError("Indica um valor positivo.");
    if (!numero.trim()) return setError("Indica o número do movimento.");
    onSave({ id: initial?.id || uid(), tipo: "saldo", data, valor: v, numero: numero.trim() });
  };
  return (
    <div>
      <Field label="Data"><input type="date" className={inputCls} value={data} onChange={(e) => setData(e.target.value)} /></Field>
      <Field label="Valor carregado (€)"><input type="text" inputMode="decimal" placeholder="0,00" className={inputCls} value={valor} onChange={(e) => setValor(e.target.value)} /></Field>
      <Field label="Número do movimento"><input type="text" className={inputCls} value={numero} onChange={(e) => setNumero(e.target.value)} placeholder="ex: MOV-2026-014" /></Field>
      {error && <p className="text-[#B33A3A] text-sm mb-3">{error}</p>}
      <div className="flex gap-2 mt-2">
        <button onClick={onClose} className="flex-1 py-2.5 rounded-lg border border-[#c9d0dc] text-[#5a6b85] font-medium hover:bg-[#1a2740]/5 transition">Cancelar</button>
        <button onClick={submit} className="flex-1 py-2.5 rounded-lg bg-[#1F6E4F] text-white font-medium hover:bg-[#195c42] transition">Guardar</button>
      </div>
    </div>
  );
}

function DocForm({ onSave, onClose, initial }) {
  const [tipo, setTipo] = useState(initial?.tipo || "factura");
  const [data, setData] = useState(initial?.data || todayISO());
  const [valor, setValor] = useState(initial?.valor ?? "");
  const [numero, setNumero] = useState(initial?.numero || "");
  const [error, setError] = useState("");
  const submit = () => {
    const v = parseFloat(String(valor).replace(",", "."));
    if (!data) return setError("Indica a data.");
    if (!v || v <= 0) return setError("Indica um valor positivo.");
    if (!numero.trim()) return setError("Indica o número do documento.");
    onSave({ id: initial?.id || uid(), tipo, data, valor: v, numero: numero.trim() });
  };
  return (
    <div>
      <Field label="Tipo de documento">
        <div className="flex rounded-lg border border-[#c9d0dc] overflow-hidden">
          {["factura", "nota_credito"].map((t) => (
            <button key={t} onClick={() => setTipo(t)} className={`flex-1 py-2.5 text-sm font-medium transition ${tipo === t ? "bg-[#1a2740] text-white" : "bg-white text-[#5a6b85] hover:bg-[#1a2740]/5"}`}>{TIPOS[t].label}</button>
          ))}
        </div>
      </Field>
      <Field label="Data"><input type="date" className={inputCls} value={data} onChange={(e) => setData(e.target.value)} /></Field>
      <Field label="Valor do documento (€, sempre positivo)"><input type="text" inputMode="decimal" placeholder="0,00" className={inputCls} value={valor} onChange={(e) => setValor(e.target.value)} /></Field>
      <Field label="Número do documento"><input type="text" className={inputCls} value={numero} onChange={(e) => setNumero(e.target.value)} placeholder="ex: FT 2026/118" /></Field>
      <p className="text-xs text-[#5a6b85] -mt-2 mb-4">{tipo === "factura" ? "Este valor será descontado ao saldo." : "Este valor será somado ao saldo."}</p>
      {error && <p className="text-[#B33A3A] text-sm mb-3">{error}</p>}
      <div className="flex gap-2 mt-2">
        <button onClick={onClose} className="flex-1 py-2.5 rounded-lg border border-[#c9d0dc] text-[#5a6b85] font-medium hover:bg-[#1a2740]/5 transition">Cancelar</button>
        <button onClick={submit} className="flex-1 py-2.5 rounded-lg bg-[#1a2740] text-white font-medium hover:bg-[#0f1826] transition">Guardar</button>
      </div>
    </div>
  );
}

function ConfirmDelete({ onConfirm, onClose, label }) {
  return (
    <div>
      <p className="text-[#1a2740] text-[15px] mb-5">Apagar definitivamente o movimento <span className="ff-num font-semibold">{label}</span>? Esta acção não pode ser desfeita.</p>
      <div className="flex gap-2">
        <button onClick={onClose} className="flex-1 py-2.5 rounded-lg border border-[#c9d0dc] text-[#5a6b85] font-medium hover:bg-[#1a2740]/5 transition">Cancelar</button>
        <button onClick={onConfirm} className="flex-1 py-2.5 rounded-lg bg-[#B33A3A] text-white font-medium hover:bg-[#9c2f2f] transition">Apagar</button>
      </div>
    </div>
  );
}

function Badge({ tipo }) {
  const t = TIPOS[tipo];
  const styles = {
    saldo: "bg-[#1F6E4F]/10 text-[#1F6E4F] border-[#1F6E4F]/30",
    factura: "bg-[#1a2740]/8 text-[#1a2740] border-[#1a2740]/25",
    nota_credito: "bg-[#8a6d1f]/10 text-[#8a6d1f] border-[#8a6d1f]/30",
  };
  return <span className={`inline-flex items-center justify-center px-2 py-0.5 rounded-full border text-[10px] font-bold tracking-wide ff-num ${styles[tipo]}`}>{t.short}</span>;
}

function App() {
  const [movimentos, setMovimentos] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [loadError, setLoadError] = useState(false);
  const [modal, setModal] = useState(null);
  const [query, setQuery] = useState("");
  const [showAll, setShowAll] = useState(false);
  const [toast, setToast] = useState("");
  const toastTimer = useRef(null);

  const fetchMovimentos = useCallback(async () => {
    const { data, error } = await supabase.from("movimentos").select("*");
    if (error) { setLoadError(true); return; }
    setLoadError(false);
    setMovimentos(data.map((r) => ({ id: r.id, tipo: r.tipo, data: r.data, valor: Number(r.valor), numero: r.numero })));
  }, []);

  useEffect(() => {
    fetchMovimentos().finally(() => setLoaded(true));
    const channel = supabase
      .channel("movimentos-realtime")
      .on("postgres_changes", { event: "*", schema: "public", table: "movimentos" }, () => {
        fetchMovimentos();
      })
      .subscribe();
    return () => { supabase.removeChannel(channel); };
  }, [fetchMovimentos]);

  const showToast = (msg) => {
    setToast(msg);
    window.clearTimeout(toastTimer.current);
    toastTimer.current = window.setTimeout(() => setToast(""), 2200);
  };

  const saveMovimento = async (mov) => {
    const editing = modal?.type?.startsWith("edit");
    const { error } = await supabase.from("movimentos").upsert({
      id: mov.id, tipo: mov.tipo, data: mov.data, valor: mov.valor, numero: mov.numero,
    });
    if (error) { showToast("Erro ao guardar."); return; }
    setModal(null);
    showToast(editing ? "Movimento actualizado." : "Movimento adicionado.");
    fetchMovimentos();
  };

  const deleteMovimento = async (id) => {
    const { error } = await supabase.from("movimentos").delete().eq("id", id);
    if (error) { showToast("Erro ao apagar."); return; }
    setModal(null);
    showToast("Movimento apagado.");
    fetchMovimentos();
  };

  const saldo = useMemo(() => movimentos.reduce((acc, m) => acc + TIPOS[m.tipo].sign * m.valor, 0), [movimentos]);
  const alerta = saldo < LIMIAR;

  const sorted = useMemo(() => [...movimentos].sort((a, b) => {
    if (a.data !== b.data) return b.data.localeCompare(a.data);
    return b.id.localeCompare(a.id);
  }), [movimentos]);

  const filtered = useMemo(() => {
    if (!query.trim()) return sorted;
    const q = query.trim().toLowerCase();
    return sorted.filter((m) => {
      const t = TIPOS[m.tipo];
      const hay = [fmtDate(m.data), t.label, m.numero, m.valor.toFixed(2), m.valor.toFixed(2).replace(".", ",")].join(" ").toLowerCase();
      return hay.includes(q);
    });
  }, [sorted, query]);

  const visible = showAll ? filtered : filtered.slice(0, 8);

  const exportCSV = () => {
    const csv = toCSV(sorted);
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `conta-corrente-clib-${todayISO()}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };

  return (
    <div className="min-h-screen bg-[#EEF1EC] ff-body text-[#1a2740]">
      <div className="max-w-2xl mx-auto px-4 pt-6 pb-28 sm:pt-10">
        <div className="flex items-baseline justify-between mb-5">
          <div>
            <p className="text-[11px] font-semibold tracking-[0.14em] uppercase text-[#5a6b85]">Colégio</p>
            <h1 className="ff-head text-[26px] leading-tight text-[#1a2740] tracking-tight">Conta Corrente <span className="text-[#1F6E4F]">CLIB</span></h1>
          </div>
          <button onClick={exportCSV} className="flex items-center gap-1.5 text-[#5a6b85] hover:text-[#1a2740] text-sm font-medium border border-[#c9d0dc] rounded-full px-3 py-1.5 bg-white/60 hover:bg-white transition">
            <IconDownload size={14} /> Exportar
          </button>
        </div>

        {alerta && (
          <div className="flex items-start gap-3 bg-[#B33A3A]/8 border border-[#B33A3A]/30 rounded-xl px-4 py-3 mb-4">
            <IconAlert size={18} className="text-[#B33A3A] shrink-0 mt-0.5" />
            <p className="text-[#8f2d2d] text-sm leading-snug">Saldo abaixo de {fmtMoney(LIMIAR)}. Convém carregar saldo em breve.</p>
          </div>
        )}

        {loadError && (
          <div className="flex items-start gap-3 bg-[#8a6d1f]/8 border border-[#8a6d1f]/30 rounded-xl px-4 py-3 mb-4">
            <IconAlert size={18} className="text-[#8a6d1f] shrink-0 mt-0.5" />
            <p className="text-[#6b5518] text-sm leading-snug">Não foi possível ligar à base de dados. Verifica a ligação à internet e recarrega a página.</p>
          </div>
        )}

        <div className="relative bg-[#1a2740] rounded-2xl px-6 py-7 mb-5 overflow-hidden shadow-[0_8px_30px_-8px_rgba(26,39,64,0.5)]">
          <div className="absolute -right-6 -top-6 w-32 h-32 rounded-full opacity-[0.06]" style={{ background: alerta ? "#B33A3A" : "#1F6E4F" }} />
          <p className="text-[11px] font-semibold tracking-[0.14em] uppercase text-[#9db0c9] mb-2">Saldo actual</p>
          <p className={`ff-num text-[40px] sm:text-[46px] leading-none font-semibold tracking-tight transition-colors ${alerta ? "text-[#f0a3a3]" : "text-[#8fd9b6]"}`}>{fmtMoney(saldo)}</p>
          <div className="flex items-center gap-2 mt-3">
            <span className={`w-1.5 h-1.5 rounded-full ${alerta ? "bg-[#f0a3a3]" : "bg-[#8fd9b6]"}`} />
            <span className="text-[#9db0c9] text-xs">{movimentos.length} movimento{movimentos.length !== 1 ? "s" : ""} registado{movimentos.length !== 1 ? "s" : ""}</span>
          </div>
        </div>

        <div className="grid grid-cols-2 gap-3 mb-8">
          <button onClick={() => setModal({ type: "saldo" })} className="flex flex-col items-start gap-2.5 bg-white rounded-xl px-4 py-4 border border-[#20304a]/10 hover:border-[#1F6E4F]/40 hover:shadow-md transition text-left">
            <span className="w-9 h-9 rounded-full bg-[#1F6E4F]/10 flex items-center justify-center text-[#1F6E4F]"><IconWallet size={17} /></span>
            <span className="font-medium text-[15px] text-[#1a2740]">Inserir Saldo</span>
          </button>
          <button onClick={() => setModal({ type: "doc" })} className="flex flex-col items-start gap-2.5 bg-white rounded-xl px-4 py-4 border border-[#20304a]/10 hover:border-[#1a2740]/40 hover:shadow-md transition text-left">
            <span className="w-9 h-9 rounded-full bg-[#1a2740]/8 flex items-center justify-center text-[#1a2740]"><IconFile size={17} /></span>
            <span className="font-medium text-[15px] text-[#1a2740]">Factura / N. Crédito</span>
          </button>
        </div>

        <div className="flex items-center justify-between mb-3">
          <h2 className="ff-head text-lg text-[#1a2740]">Movimentos</h2>
        </div>

        <div className="relative mb-3">
          <IconSearch size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-[#8a97ac]" />
          <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Pesquisar por data, tipo, número ou valor…" className="w-full rounded-lg border border-[#c9d0dc] bg-white pl-9 pr-3 py-2.5 text-sm text-[#1a2740] focus:outline-none focus:ring-2 focus:ring-[#1F6E4F]/30 focus:border-[#1F6E4F] transition" />
        </div>

        {!loaded ? (
          <p className="text-[#8a97ac] text-sm py-8 text-center">A carregar…</p>
        ) : filtered.length === 0 ? (
          <div className="text-center py-10 border border-dashed border-[#c9d0dc] rounded-xl">
            <p className="text-[#5a6b85] text-sm">{movimentos.length === 0 ? "Ainda não há movimentos. Começa por inserir um saldo ou uma factura." : "Nenhum movimento corresponde à pesquisa."}</p>
          </div>
        ) : (
          <div className="bg-white rounded-xl border border-[#20304a]/10 divide-y divide-[#20304a]/8 overflow-hidden">
            {visible.map((m) => {
              const t = TIPOS[m.tipo];
              const efeito = t.sign * m.valor;
              return (
                <div key={m.id} className="flex items-center gap-3 px-4 py-3 group">
                  <Badge tipo={m.tipo} />
                  <div className="flex-1 min-w-0">
                    <div className="flex items-baseline gap-2">
                      <span className="ff-num text-sm text-[#1a2740]">{fmtDate(m.data)}</span>
                      <span className="text-[#8a97ac] text-xs truncate">nº {m.numero}</span>
                    </div>
                  </div>
                  <span className={`ff-num text-sm font-medium shrink-0 ${efeito >= 0 ? "text-[#1F6E4F]" : "text-[#1a2740]"}`}>{efeito >= 0 ? "+" : ""}{fmtMoney(efeito)}</span>
                  <div className="flex items-center gap-0.5 shrink-0 opacity-60 group-hover:opacity-100 transition">
                    <button onClick={() => setModal({ type: m.tipo === "saldo" ? "edit-saldo" : "edit-doc", payload: m })} className="p-1.5 rounded-md hover:bg-[#1a2740]/5 text-[#5a6b85]" aria-label="Editar"><IconPencil size={14} /></button>
                    <button onClick={() => setModal({ type: "delete", payload: m })} className="p-1.5 rounded-md hover:bg-[#B33A3A]/10 text-[#B33A3A]" aria-label="Apagar"><IconTrash size={14} /></button>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {filtered.length > 8 && (
          <button onClick={() => setShowAll((s) => !s)} className="w-full flex items-center justify-center gap-1.5 mt-3 py-2.5 text-sm font-medium text-[#5a6b85] hover:text-[#1a2740] transition">
            {showAll ? (<>Mostrar menos <IconChevronUp size={15} /></>) : (<>Ver todos os movimentos ({filtered.length}) <IconChevronDown size={15} /></>)}
          </button>
        )}
      </div>

      <div className="fixed bottom-5 inset-x-0 flex justify-center sm:hidden pointer-events-none">
        <div className="flex gap-2 pointer-events-auto bg-white/90 backdrop-blur border border-[#20304a]/10 rounded-full shadow-lg px-2 py-2">
          <button onClick={() => setModal({ type: "saldo" })} className="flex items-center gap-1.5 bg-[#1F6E4F] text-white text-sm font-medium rounded-full px-3.5 py-2"><IconPlus size={15} /> Saldo</button>
          <button onClick={() => setModal({ type: "doc" })} className="flex items-center gap-1.5 bg-[#1a2740] text-white text-sm font-medium rounded-full px-3.5 py-2"><IconPlus size={15} /> Doc.</button>
        </div>
      </div>

      {toast && (
        <div className="fixed bottom-20 sm:bottom-6 left-1/2 -translate-x-1/2 bg-[#1a2740] text-white text-sm px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2 z-50">
          <IconCheck size={14} className="text-[#8fd9b6]" /> {toast}
        </div>
      )}

      {modal?.type === "saldo" && (<Modal title="Inserir Saldo" onClose={() => setModal(null)}><SaldoForm onSave={saveMovimento} onClose={() => setModal(null)} /></Modal>)}
      {modal?.type === "edit-saldo" && (<Modal title="Editar Saldo" onClose={() => setModal(null)}><SaldoForm onSave={saveMovimento} onClose={() => setModal(null)} initial={modal.payload} /></Modal>)}
      {modal?.type === "doc" && (<Modal title="Inserir Factura / Nota de Crédito" onClose={() => setModal(null)}><DocForm onSave={saveMovimento} onClose={() => setModal(null)} /></Modal>)}
      {modal?.type === "edit-doc" && (<Modal title="Editar Documento" onClose={() => setModal(null)}><DocForm onSave={saveMovimento} onClose={() => setModal(null)} initial={modal.payload} /></Modal>)}
      {modal?.type === "delete" && (<Modal title="Apagar movimento" onClose={() => setModal(null)}><ConfirmDelete label={modal.payload.numero} onClose={() => setModal(null)} onConfirm={() => deleteMovimento(modal.payload.id)} /></Modal>)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
